<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FLARE Receiver</title>
<style>
  :root {
    --bg: #17171c;
    --panel: #232329;
    --panel2: #1c1c22;
    --fg: #f2f2f5;
    --dim: #96969f;
    --accent: #4fc3f7;
    --on: #ffca28;
    --good: #4caf6d;
    --good-bg: #14301f;
    --bad: #ef5350;
    --bad-bg: #351617;
    --border: #33333c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  }
  body {
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 4px 0 2px;
  }
  .header p {
    font-size: 13px;
    color: var(--dim);
    margin: 0;
  }

  /* Step indicator */
  .steps {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }
  .step-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.25s, transform 0.25s;
  }
  .step-dot.active {
    background: var(--accent);
    transform: scale(1.3);
  }
  .step-dot.done {
    background: var(--good);
  }

  .card {
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }

  /* Camera / viewfinder */
  .viewfinder {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 4 / 3;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .aim-guide {
    position: absolute;
    top: 38%;
    left: 38%;
    width: 24%;
    height: 24%;
    pointer-events: none;
  }
  .aim-guide::before, .aim-guide::after,
  .aim-corner-tl, .aim-corner-br { content: ''; }
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 3px solid var(--accent);
    opacity: 0.9;
  }
  .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
  .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 4px 0 0; }
  .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 4px; }
  .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
  .aim-guide.pulsing .corner { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .cam-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    color: var(--dim);
    font-size: 13px;
    text-align: center;
    padding: 20px;
  }
  .cam-icon { font-size: 34px; opacity: 0.6; }

  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 12px;
    transition: transform 0.08s, opacity 0.15s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.35; }
  .btn-primary { background: var(--accent); color: #06202a; }
  .btn-good { background: var(--good); color: #06200f; }
  .btn-ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
  }

  .hint {
    font-size: 12.5px;
    color: var(--dim);
    margin-top: 8px;
    line-height: 1.4;
    text-align: center;
  }

  /* Status banner */
  .status-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 14px;
  }
  .status-banner.listening { background: #1b2733; color: var(--accent); }
  .status-banner.good { background: var(--good-bg); color: var(--good); }
  .status-banner.bad { background: var(--bad-bg); color: var(--bad); }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .status-banner.listening .status-dot { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* Decoded message result */
  .result-card {
    text-align: center;
    padding: 28px 18px;
  }
  .result-icon { font-size: 40px; margin-bottom: 8px; }
  .result-text {
    font-size: 22px;
    font-weight: 600;
    word-break: break-word;
    line-height: 1.4;
    margin: 8px 0 4px;
  }
  .result-sub { font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .result-actions { display: flex; gap: 10px; margin-top: 14px; }
  .result-actions button { margin-top: 0; }

  /* Settings row */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .settings-row label { font-size: 14px; }
  input[type=number] {
    width: 76px;
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
    text-align: center;
  }

  /* Advanced / debug (collapsed by default) */
  details.advanced { margin-top: 4px; }
  details.advanced summary {
    font-size: 13px;
    color: var(--dim);
    cursor: pointer;
    padding: 6px 0;
    list-style: none;
  }
  details.advanced summary::-webkit-details-marker { display: none; }
  details.advanced summary::before {
    content: '\25B8';
    display: inline-block;
    margin-right: 6px;
    transition: transform 0.15s;
  }
  details.advanced[open] summary::before { transform: rotate(90deg); }
  .diag-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--dim);
    padding: 4px 0;
    font-family: 'SF Mono', Menlo, monospace;
  }
  .diag-row span:last-child { color: var(--fg); }
  canvas#waveCanvas {
    width: 100%;
    height: 44px;
    background: var(--panel2);
    border-radius: 8px;
    margin: 8px 0;
    display: block;
  }
  .log {
    background: var(--panel2);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: Menlo, monospace;
    font-size: 10.5px;
    color: #8a8a94;
    height: 110px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>FLARE Receiver</h1>
  <p>Catch a message sent as flashing light</p>
</div>

<div class="steps">
  <div class="step-dot" data-step="1"></div>
  <div class="step-dot" data-step="2"></div>
  <div class="step-dot" data-step="3"></div>
</div>

<div id="statusBanner" class="status-banner" style="display:none;">
  <div class="status-dot"></div>
  <span id="statusBannerText"></span>
</div>

<!-- Camera card: always visible -->
<div class="card">
  <div class="viewfinder" id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-placeholder" id="camPlaceholder">
      <div class="cam-icon">&#128247;</div>
      <div>Camera preview appears here</div>
    </div>
    <div class="aim-guide" id="aimGuide" style="display:none;">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
  </div>
  <button class="btn-primary" id="mainActionBtn">Start Camera</button>
  <p class="hint" id="mainHint">Point your camera at the screen or LED that will flash the message.</p>
</div>

<!-- Result card: shown after a decode attempt -->
<div class="card result-card" id="resultCard" style="display:none;">
  <div class="result-icon" id="resultIcon">&#10003;</div>
  <div class="result-text" id="resultText"></div>
  <div class="result-sub" id="resultSub"></div>
  <div class="result-actions">
    <button class="btn-ghost" id="copyBtn" style="display:none;">Copy</button>
    <button class="btn-good" id="listenAgainBtn">Listen for Another</button>
  </div>
</div>

<!-- Settings -->
<div class="card">
  <div class="settings-row">
    <label for="slotMs">Flash speed (must match sender)</label>
    <input type="number" id="slotMs" value="300" min="20" max="1000" step="10">
  </div>
  <p class="hint">150&ndash;300ms/bit works best for a phone camera. Slower is more reliable.</p>

  <details class="advanced">
    <summary>Advanced diagnostics</summary>
    <div class="diag-row"><span>Brightness</span><span id="brightnessVal">&mdash;</span></div>
    <div class="diag-row"><span>Threshold</span><span id="thresholdVal">&mdash;</span></div>
    <div class="diag-row"><span>Transitions detected</span><span id="transitionCount">0</span></div>
    <canvas id="waveCanvas" width="320" height="44"></canvas>
    <div class="log" id="logText"></div>
  </details>
</div>

<script src="flare.js"></script>
<script>
(function () {
  const video = document.getElementById("video");
  const camPlaceholder = document.getElementById("camPlaceholder");
  const aimGuide = document.getElementById("aimGuide");
  const mainActionBtn = document.getElementById("mainActionBtn");
  const mainHint = document.getElementById("mainHint");
  const statusBanner = document.getElementById("statusBanner");
  const statusBannerText = document.getElementById("statusBannerText");
  const resultCard = document.getElementById("resultCard");
  const resultIcon = document.getElementById("resultIcon");
  const resultText = document.getElementById("resultText");
  const resultSub = document.getElementById("resultSub");
  const copyBtn = document.getElementById("copyBtn");
  const listenAgainBtn = document.getElementById("listenAgainBtn");
  const slotMsInput = document.getElementById("slotMs");
  const brightnessVal = document.getElementById("brightnessVal");
  const thresholdVal = document.getElementById("thresholdVal");
  const transitionCountEl = document.getElementById("transitionCount");
  const waveCanvas = document.getElementById("waveCanvas");
  const waveCtx = waveCanvas.getContext("2d");
  const logText = document.getElementById("logText");
  const stepDots = document.querySelectorAll(".step-dot");

  let stream = null;
  let sampleCanvas = document.createElement("canvas");
  sampleCanvas.width = 32;
  sampleCanvas.height = 32;
  let sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

  let listening = false;
  let receiver = null;
  let listenStartTime = null;
  let rollingMin = 255, rollingMax = 0;
  let rollingWindow = [];
  const ROLLING_WINDOW_MS = 1500;
  let decodeIntervalHandle = null;
  let wakeLock = null;

  let waveHistory = [];
  const WAVE_WINDOW_MS = 4000;
  let transitionCount = 0;
  let lastOnState = null;

  // state: 'idle' | 'ready' | 'listening' | 'success' | 'failed'
  let uiState = "idle";

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    logText.textContent += `[${t}] ${msg}\n`;
    logText.scrollTop = logText.scrollHeight;
  }

  function setStep(n) {
    stepDots.forEach((dot) => {
      const i = parseInt(dot.dataset.step, 10);
      dot.classList.toggle("active", i === n);
      dot.classList.toggle("done", i < n);
    });
  }

  function setBanner(kind, text) {
    if (!kind) {
      statusBanner.style.display = "none";
      return;
    }
    statusBanner.style.display = "flex";
    statusBanner.className = "status-banner " + kind;
    statusBannerText.textContent = text;
  }

  function render() {
    resultCard.style.display = uiState === "success" || uiState === "failed" ? "block" : "none";

    if (uiState === "idle") {
      setStep(1);
      setBanner(null);
      mainActionBtn.textContent = "Start Camera";
      mainActionBtn.className = "btn-primary";
      mainActionBtn.disabled = false;
      mainHint.textContent = "Point your camera at the screen or LED that will flash the message.";
      aimGuide.style.display = "none";
    } else if (uiState === "ready") {
      setStep(2);
      setBanner(null);
      mainActionBtn.textContent = "Start Listening";
      mainActionBtn.className = "btn-primary";
      mainActionBtn.disabled = false;
      mainHint.textContent = "Aim the corners at the flashing area, then tap Start Listening before the sender hits Send.";
      aimGuide.style.display = "block";
      aimGuide.classList.remove("pulsing");
    } else if (uiState === "listening") {
      setStep(3);
      setBanner("listening", "Listening for a message\u2026");
      mainActionBtn.textContent = "Stop Listening";
      mainActionBtn.className = "btn-ghost";
      mainActionBtn.disabled = false;
      mainHint.textContent = "Hold steady. This can take a few seconds depending on message length.";
      aimGuide.style.display = "block";
      aimGuide.classList.add("pulsing");
    } else if (uiState === "success") {
      setStep(3);
      setBanner("good", "Message received");
      mainActionBtn.textContent = "Listening Stopped";
      mainActionBtn.className = "btn-ghost";
      mainActionBtn.disabled = true;
      aimGuide.classList.remove("pulsing");
      resultIcon.textContent = "\u2705";
      resultIcon.style.color = "";
      resultText.textContent = window.__lastDecodedText || "";
      resultSub.textContent = "Checksum verified \u2014 no errors";
      copyBtn.style.display = "inline-block";
    } else if (uiState === "failed") {
      setStep(3);
      setBanner("bad", "Reception failed");
      mainActionBtn.textContent = "Listening Stopped";
      mainActionBtn.className = "btn-ghost";
      mainActionBtn.disabled = true;
      aimGuide.classList.remove("pulsing");
      resultIcon.textContent = "\u26A0\uFE0F";
      resultText.textContent = "Couldn't read that one";
      resultSub.textContent = window.__lastError || "Try a slower flash speed or a dimmer room.";
      copyBtn.style.display = "none";
    }
  }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {
      // Not fatal -- screen may just dim during a long listen.
    }
  }
  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  async function startCamera() {
    mainActionBtn.disabled = true;
    mainActionBtn.textContent = "Requesting camera\u2026";
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 60 },
          advanced: [{ exposureMode: "manual" }, { whiteBalanceMode: "manual" }],
        },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      camPlaceholder.style.display = "none";
      uiState = "ready";
      render();
      log("Camera started");
      requestAnimationFrame(sampleLoop);
    } catch (err) {
      mainActionBtn.disabled = false;
      mainActionBtn.textContent = "Start Camera";
      setBanner("bad", "Camera access failed");
      log("ERROR opening camera: " + err.message);
    }
  }

  function currentBrightness() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const sx = vw * 0.38, sy = vh * 0.38, sw = vw * 0.24, sh = vh * 0.24;
    sampleCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sampleCanvas.width, sampleCanvas.height);
    const frame = sampleCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;
    let sum = 0, count = 0;
    for (let i = 0; i < frame.length; i += 4) {
      sum += 0.299 * frame[i] + 0.587 * frame[i + 1] + 0.114 * frame[i + 2];
      count++;
    }
    return sum / count;
  }

  function sampleLoop(now) {
    const brightness = currentBrightness();
    if (brightness !== null) {
      rollingWindow.push({ t: now, brightness });
      while (rollingWindow.length && now - rollingWindow[0].t > ROLLING_WINDOW_MS) {
        rollingWindow.shift();
      }
      rollingMin = Math.min(...rollingWindow.map((s) => s.brightness));
      rollingMax = Math.max(...rollingWindow.map((s) => s.brightness));
      const threshold = (rollingMin + rollingMax) / 2;
      const on = brightness > threshold;

      brightnessVal.textContent = brightness.toFixed(1);
      thresholdVal.textContent = threshold.toFixed(1) +
        ` (${rollingMin.toFixed(0)}\u2013${rollingMax.toFixed(0)})`;

      if (lastOnState !== null && on !== lastOnState) {
        transitionCount++;
        transitionCountEl.textContent = transitionCount;
      }
      lastOnState = on;
      waveHistory.push({ t: now, on });
      while (waveHistory.length && now - waveHistory[0].t > WAVE_WINDOW_MS) {
        waveHistory.shift();
      }
      drawWaveform();

      if (listening && receiver) {
        const t = now - listenStartTime;
        receiver.ingestSample(t, on);
      }
    }
    if (stream) {
      requestAnimationFrame(sampleLoop);
    }
  }

  function drawWaveform() {
    const w = waveCanvas.width, h = waveCanvas.height;
    waveCtx.clearRect(0, 0, w, h);
    if (waveHistory.length < 2) return;
    const t0 = waveHistory[0].t;
    const tLast = waveHistory[waveHistory.length - 1].t;
    const span = Math.max(tLast - t0, 1);
    waveCtx.strokeStyle = "#ffca28";
    waveCtx.lineWidth = 2;
    waveCtx.beginPath();
    let prevX = null, prevY = null;
    for (const s of waveHistory) {
      const x = ((s.t - t0) / span) * w;
      const y = s.on ? 6 : h - 6;
      if (prevX === null) waveCtx.moveTo(x, y);
      else { waveCtx.lineTo(x, prevY); waveCtx.lineTo(x, y); }
      prevX = x; prevY = y;
    }
    waveCtx.stroke();
  }

  function startListening() {
    const slotMs = parseFloat(slotMsInput.value) || 150;
    receiver = new Flare.FlareReceiver(slotMs);
    listenStartTime = performance.now();
    listening = true;
    uiState = "listening";
    render();
    requestWakeLock();
    log(`Listening started (slot=${slotMs}ms)`);

    decodeIntervalHandle = setInterval(() => {
      if (!listening || !receiver) return;
      const result = receiver.attemptDecode();
      if (result) {
        if (result.crcValid) {
          window.__lastDecodedText = result.text;
          uiState = "success";
          if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
          log(`DECODED: ${JSON.stringify(result.text)} (CRC valid)`);
        } else {
          window.__lastError = result.error;
          uiState = "failed";
          if (navigator.vibrate) navigator.vibrate(200);
          log(`DECODE FAILED: ${result.error}`);
          if (result.rawBits) {
            const xCount = (result.rawBits.match(/X/g) || []).length;
            log(`RAW BITS: ${result.rawBits}`);
            log(`AMBIGUOUS BITS: ${xCount} of ${result.rawBits.length}`);
          }
        }
        stopListening();
        render();
      }
    }, 200);
  }

  function stopListening() {
    listening = false;
    releaseWakeLock();
    if (decodeIntervalHandle) {
      clearInterval(decodeIntervalHandle);
      decodeIntervalHandle = null;
    }
  }

  mainActionBtn.addEventListener("click", () => {
    if (uiState === "idle") {
      startCamera();
    } else if (uiState === "ready") {
      startListening();
    } else if (uiState === "listening") {
      stopListening();
      uiState = "ready";
      render();
      log("Listening stopped by user");
    }
  });

  listenAgainBtn.addEventListener("click", () => {
    uiState = "ready";
    render();
  });

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(window.__lastDecodedText || "");
      copyBtn.textContent = "Copied!";
      setTimeout(() => { copyBtn.textContent = "Copy"; }, 1200);
    } catch (e) {
      log("Clipboard copy failed: " + e.message);
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && listening) {
      requestWakeLock();
    }
  });

  render();
})();
</script>

</body>
</html>
